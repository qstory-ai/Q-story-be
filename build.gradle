plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.qstory'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // 실시간 받아 적기(sttstream) - 앱·웹이 말하는 동안 오디오를 WebSocket으로 보내고 중간 문장을 받는다.
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.9.1'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    runtimeOnly 'org.postgresql:postgresql'
    // db/schema의 SQL을 한 번씩만 실행하고 적용 이력을 flyway_schema_history에 남긴다(application.yml 참고).
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // Grafana Cloud Loki 로그 전송 - logback-spring.xml의 LOKI appender가 이걸로 동작한다.
    // LOKI_URL이 설정 안 됐으면(로컬/CI) 그 appender 자체가 안 만들어지므로 이 의존성은 로드만 되고
    // 아무 것도 안 한다.
    implementation 'com.github.loki4j:loki-logback-appender:2.0.3'
    // logback-spring.xml의 <if>/<then> 조건부 설정(LOKI_URL 존재 여부로 appender 유무 결정)에 필요.
    runtimeOnly 'org.codehaus.janino:janino'

    // 앱 푸시(FCM HTTP v1)의 OAuth2 액세스 토큰 - 서비스 계정 키로 JWT를 서명해 교환하고 만료 전까지 재사용한다.
    // 발송 자체는 java.net.http로 한다(push/service/FcmClient). firebase-admin은 쓰지 않는다.
    implementation 'com.google.auth:google-auth-library-oauth2-http:1.54.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// 공공데이터 기관 목록(유치원·어린이집) 적재 - 운영자가 손으로 돌린다. 사용법은 PublicInstitutionImportMain 주석.
// 예: ./gradlew importPublicInstitutions -Pargs="kindergarten --timing 20261 --dry-run"
tasks.register('importPublicInstitutions', JavaExec) {
    group = 'qstory'
    description = '유치원알리미/어린이집정보공개포털 기관 목록을 public_institution에 넣는다'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.qstory.backend.institution.importer.PublicInstitutionImportMain'
    jvmArgs '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
    args = (project.findProperty('args') ?: '').toString().trim().split(/\s+(?=(?:[^"]*"[^"]*")*[^"]*$)/)
            .findAll { it }
            .collect { it.replaceAll(/^"|"$/, '') }
}
