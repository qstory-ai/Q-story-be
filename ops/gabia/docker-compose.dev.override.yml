# 개발 서버 전용: 같은 서버 안의 Postgres 컨테이너를 DB로 쓴다(추가 비용 없음).
# 운영 데이터는 넣지 않는다(Q-41). 스키마는 앱이 뜰 때 Flyway가 만든다.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: db.env
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30", "-c", "work_mem=4MB"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qstory -d qstory"]
      interval: 5s
      retries: 20
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
  app:
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata:
