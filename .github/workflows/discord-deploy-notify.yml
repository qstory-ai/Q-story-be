# 운영 배포 결과를 디스코드 #배포 채널로 한 줄 보낸다(백엔드(Railway)).
#
# Railway가 이 저장소에 GitHub 배포 상태(deployment_status)를 남길 때마다 돈다. 운영(production) 환경의
# 성공·실패만 알리고 미리보기·진행 중·inactive는 건너뛴다.
#   - 성공: 멘션 없이 조용히(알림음 없는 메시지, flags=4096) 한 줄.
#   - 실패: @개발 역할 멘션(DISCORD_ROLE_DEV_ID가 비어 있으면 멘션 없이).
# 한 배포에 성공 상태가 여러 번 오면(Vercel 프로젝트가 여럿 연결된 경우) 처음 것 하나만 알린다.
#
# 시크릿: DISCORD_WEBHOOK_DEPLOY(없으면 아무것도 안 함), DISCORD_ROLE_DEV_ID(선택).
name: discord-deploy-notify

on:
  deployment_status:

permissions:
  contents: read
  deployments: read
  pull-requests: read

jobs:
  notify:
    if: >-
      contains(fromJSON('["success","failure","error"]'), github.event.deployment_status.state) &&
      contains(github.event.deployment.environment, 'roduction')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_DEPLOY }}
          ROLE_DEV: ${{ secrets.DISCORD_ROLE_DEV_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LABEL: 백엔드(Railway)
          STATE: ${{ github.event.deployment_status.state }}
          DEPLOY_ID: ${{ github.event.deployment.id }}
          STATUS_ID: ${{ github.event.deployment_status.id }}
          SHA: ${{ github.event.deployment.sha }}
          LOG_URL: ${{ github.event.deployment_status.log_url || github.event.deployment_status.target_url }}
          ENV_URL: ${{ github.event.deployment_status.environment_url }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_DEPLOY 시크릿이 없어 건너뛴다."
            exit 0
          fi
          if [ "$STATE" = "success" ]; then
            first=$(gh api "repos/$REPO/deployments/$DEPLOY_ID/statuses?per_page=100" \
              --jq '[.[] | select(.state == "success")] | sort_by(.created_at, .id) | .[0].id // empty' || true)
            if [ -n "$first" ] && [ "$first" != "$STATUS_ID" ]; then
              echo "이 배포의 성공은 이미 알렸다."
              exit 0
            fi
          fi
          short=${SHA:0:7}
          title=$(gh api "repos/$REPO/commits/$SHA" --jq '.commit.message | split("\n")[0]' 2>/dev/null || true)
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number // empty' 2>/dev/null || true)
          ref="$short"
          if [ -n "$pr" ]; then ref="#$pr $short"; fi
          if [ "$STATE" = "success" ]; then
            text="[배포] $LABEL 성공 · $ref ${title}"
            if [ -n "$ENV_URL" ]; then text="$text · <$ENV_URL>"; fi
            flags=4096
            roles='[]'
            prefix=""
          else
            text="[배포] $LABEL **실패** · $ref ${title}"
            if [ -n "$LOG_URL" ]; then text="$text · 로그 <$LOG_URL>"; fi
            flags=0
            if printf '%s' "$ROLE_DEV" | grep -Eq '^[0-9]{5,25}$'; then
              prefix="<@&$ROLE_DEV> "
              roles="[\"$ROLE_DEV\"]"
            else
              prefix=""
              roles='[]'
            fi
          fi
          body=$(jq -n --arg content "$prefix$text" --argjson roles "$roles" --argjson flags "$flags" \
            '{content: ($content | .[0:1990]), flags: $flags, allowed_mentions: {parse: [], roles: $roles}}')
          for attempt in 1 2 3 4; do
            code=$(curl -sS -o /tmp/discord.out -w '%{http_code}' -m 15 -H 'content-type: application/json' \
              -d "$body" "$WEBHOOK" || echo 000)
            if [ "$code" = "429" ]; then
              wait=$(jq -r '.retry_after // 1' /tmp/discord.out 2>/dev/null || echo 1)
              sleep "$(printf '%.0f' "$wait")"; sleep 1
              continue
            fi
            break
          done
          echo "discord status=$code"
          # 알림 실패로 배포 기록을 빨갛게 만들지 않는다.
          exit 0
