server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  application:
    name: q-story-speech-api
  # No SPRING_PROFILES_ACTIVE set -> falls back to "dev" (see application-dev.yml/-staging.yml/-prod.yml
  # for what differs per environment: allowed-origins, log level, SQL logging).
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 4MB
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SUPABASE_DB_USERNAME:postgres}
    password: ${SUPABASE_DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${SUPABASE_DB_POOL_SIZE:10}
  flyway:
    # db/schema의 파일은 한 번씩만 실행되고 적용 이력이 flyway_schema_history에 남는다. 파일 이름이
    # "NNN-설명.sql"이라 버전 접두사를 비우고 구분자를 "-"로 둔다 - 새 파일도 같은 형식으로 추가한다.
    # Flyway 도입 전(매 부팅마다 전체 재실행)부터 쓰던 기존 DB는 0을 기준선으로 삼아 001부터 한 번씩 전부
    # 실행한다 - 도입 전 파일은 모두 멱등이라 다시 실행해도 안전하고, 환경마다 어디까지 적용됐는지 가정하지 않는다.
    # 적용된 파일은 수정하지 말고(체크섬 검증) 새 파일을 추가한다.
    locations: classpath:db/schema
    sql-migration-prefix: ""
    sql-migration-separator: "-"
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    open-in-view: false
    hibernate:
      # The SQL under db/schema owns the schema; Hibernate only checks that the entities still
      # match it, so a mapping change without matching SQL fails at boot instead of silently
      # altering a table.
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
        jdbc.time_zone: UTC
        format_sql: false

qstory:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006,https://q-story-f07-pilot.kaangaa.chatgpt.site,http://localhost:5173,http://127.0.0.1:5173,https://qstory.ai.kr,https://www.qstory.ai.kr,https://start.qstory.ai.kr,https://play.qstory.ai.kr,https://dev.qstory.ai.kr,https://demo.qstory.ai.kr,https://demo.api.qstory.ai.kr}
  # 태블릿·폰 네이티브 앱(Capacitor WebView)의 출처 - fe/q-story-web/capacitor.config.ts의
  # server.hostname(app.qstory.ai.kr)에 Android는 https, iOS는 capacitor 스킴이 붙는다.
  # 프로필 yml이나 ALLOWED_ORIGINS가 allowed-origins를 덮어써도 SecurityConfig가 이 목록을 항상
  # 더하므로, 여기 한 곳만 관리하면 된다.
  native-origins: https://app.qstory.ai.kr,capacitor://app.qstory.ai.kr
  max-audio-bytes: ${MAX_AUDIO_BYTES:2621440}
  request-timeout-ms: ${REQUEST_TIMEOUT_MS:40000}
  ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
  beta:
    # 베타 기간 선생님·관리자 전체 개방(보호자 제외). 정식 출시 때 false.
    open-access-tutor-org: ${BETA_OPEN_ACCESS_TUTOR_ORG:true}
  # 실시간 받아 적기(sttstream, POST /v1/stt/stream-tickets + wss /v1/stt/stream). 끄면(STT_STREAM_ENABLED=false)
  # 표 발급이 503 STT_STREAM_UNAVAILABLE로 거절되고, 앱은 지금처럼 녹음을 다 올려 받아 적는다(배치).
  stt-stream:
    enabled: ${STT_STREAM_ENABLED:true}
    # RTZR 스트리밍 동시 채널 상한(유료 20) 안에서 우리가 쓸 몫. 넘치면 표를 주지 않아 배치로 간다.
    max-concurrent: ${STT_STREAM_MAX_CONCURRENT:10}
    # 한 번 말하기 상한 - 앱의 30초 녹음 상한 + 여유. 넘으면 그때까지 들은 문장으로 끝낸다.
    max-duration-ms: ${STT_STREAM_MAX_DURATION_MS:35000}
    ticket-ttl-ms: 30000
    # 대화(sessionId) 하나가 10분 동안 받을 수 있는 표, 서버 전체가 1분 동안 줄 수 있는 표.
    session-ticket-limit: 40
    global-tickets-per-minute: 120
  # 요청 상한(보안 점검 M1/M2, ratelimit/). 메모리 토큰 버킷이라 인스턴스 하나 기준이다. 문제가 생기면
  # QSTORY_RATE_LIMIT_ENABLED=false로 모두 끈다. 상한별 값은 아래 limits에서 바꾼다(빠진 것은 RateLimitRule의 기본값).
  rate-limit:
    enabled: ${QSTORY_RATE_LIMIT_ENABLED:true}
    # Vercel 프록시(fe/api/_qstory-proxy-core.mjs)와 같은 값. 프록시가 이 비밀로 서명한 x-qstory-client-ip만 믿는다.
    # 비어 있으면 그 헤더를 보지 않고 연결 주소로 센다(웹 요청은 Vercel 주소 몇 개로 묶인다).
    proxy-shared-secret: ${QSTORY_PROXY_SHARED_SECRET:}
    # 서명이 없을 때(네이티브 앱·WebSocket) 볼 주소 헤더. 운영은 application-prod.yml에서 X-Real-IP.
    client-ip-header: ${QSTORY_CLIENT_IP_HEADER:}
    # 로그인하지 않은 실시간 TTS(기본 Gemini 키, 하루 100회)의 하루 상한 - 나머지는 로그인한 UT 사용자 몫.
    tts-anonymous-daily: ${QSTORY_TTS_ANONYMOUS_DAILY_LIMIT:80}
    limits:
      tts: { requests: 40, window: 10m }
      tts-anonymous-hourly: { requests: 60, window: 1h }
      companion-chat: { requests: 30, window: 5m }
      companion-chat-global: { requests: 1200, window: 1h }
      stt: { requests: 40, window: 5m }
      stt-global: { requests: 1500, window: 1h }
      question-route: { requests: 30, window: 5m }
      question-route-global: { requests: 1200, window: 1h }
      login-client: { requests: 30, window: 15m }
      login-account: { requests: 10, window: 15m }
      login-id: { requests: 50, window: 1h }
      signup: { requests: 10, window: 1h }
      signup-staff: { requests: 5, window: 1h }
      admin-token-failure: { requests: 10, window: 1h }
      password-reset-request: { requests: 5, window: 1h }
      password-reset-confirm: { requests: 10, window: 1h }
      password-change: { requests: 10, window: 15m }
      interactions: { requests: 120, window: 1m }
      recording-chunks: { requests: 30, window: 1m }
      play-session-turns: { requests: 60, window: 1m }
      beta-events: { requests: 120, window: 1m }
      client-errors: { requests: 120, window: 1m }
      recording-consents: { requests: 30, window: 1h }
      launch-notifications: { requests: 10, window: 1h }
      completion-surveys: { requests: 10, window: 1h }
      voice-research: { requests: 30, window: 1h }
      feedback: { requests: 20, window: 1h }
  providers:
    rtzr:
      client-id: ${RTZR_CLIENT_ID:}
      client-secret: ${RTZR_CLIENT_SECRET:}
    open-router:
      api-key: ${OPENROUTER_API_KEY:}
      llm-model: ${OPENROUTER_LLM_MODEL:google/gemini-3.6-flash}
      # 3단계 라우팅 파이프라인의 1단계(safety_scope_gate) 전용 - 빠르고 저렴한 모델. 따로 지정하지
      # 않으면 llm-model과 같은 모델을 쓴다.
      safety-model: ${OPENROUTER_SAFETY_MODEL:${OPENROUTER_LLM_MODEL:google/gemini-3.6-flash}}
      image-model: ${OPENROUTER_IMAGE_MODEL:google/gemini-3.1-flash-image}
    # TTS는 OpenRouter를 거치지 않고 Gemini의 Interactions API(generativelanguage.googleapis.com)를
    # 직접 호출한다 - gemini-*-tts-preview 모델과 Sulafat 등 프리셋 목소리는 OpenRouter 카탈로그에 없다.
    gemini:
      api-key: ${GEMINI_API_KEY:}
      tts-model: ${GEMINI_TTS_MODEL:gemini-3.1-flash-tts-preview}
      tts-voice: ${GEMINI_TTS_VOICE:Sulafat}
      # 선택지 음성 미리 만들기 전용 키(기본 키의 하루 한도와 분리). 비면 prefetch 요청은 TTS 호출 없이 409.
      prefetch-api-key: ${GEMINI_TTS_PREFETCH_API_KEY:}
  # 그레텔 답 음성을 빨리 들려주기 위한 스트리밍 스위치 - 소리 품질·한도에 문제가 생기면 Railway 변수로 바로 끈다.
  voice-streaming:
    # POST /v1/narrations/stream이 Gemini가 만드는 대로 PCM을 내보낸다(false: 전체를 만든 뒤 보냄). 호출 수는 같다.
    tts: ${GEMINI_TTS_STREAMING:true}
    # POST /v1/companion-chat/messages가 stream:true 요청에 답 문장을 먼저 한 줄로 보낸다(NDJSON, false: 늘 JSON 하나).
    companion-reply: ${COMPANION_REPLY_STREAMING:true}
    oauth:
      # 둘 다 "비밀값"이 아니다 - client-id/app-id는 프론트 SDK 초기화에도 그대로 노출되는
      # 공개 식별자다(실제 시크릿은 아래 verifier들이 provider의 토큰 검증 엔드포인트만 호출해서
      # 서버가 별도로 들고 있을 필요가 없다 - GoogleOAuthVerifier/KakaoOAuthVerifier 참고).
      google:
        client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
      kakao:
        app-id: ${KAKAO_APP_ID:}
  supabase:
    url: ${SUPABASE_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    voice-research-bucket: ${SUPABASE_VOICE_RESEARCH_BUCKET:qstory-voice-research}
    shadow-assets-bucket: ${SUPABASE_SHADOW_ASSETS_BUCKET:qstory-shadow-assets}
    # 임포트된 정적 내레이션/브릿지 오디오(`<slug>/audio/x.mp3`, fe `npm run assets:upload`가 올림)와
    # 편집된 문장에서 재렌더링된 내레이션(`<storyId>/<segmentId>.mp3`)이 함께 사는 공개 버킷.
    # GET /v1/stories/{id}/content의 asset.url은 여기 공개 URL이다(StoryAssetUrls).
    story-audio-bucket: ${SUPABASE_STORY_AUDIO_BUCKET:qstory-story-audio}
    # 임포트된 정적 삽화(`<slug>/illustrations/x.jpg`)와 LiveBranchExecutionWorker가 실시간으로 생성한
    # 분기 삽화가 함께 사는 공개 버킷. 역시 asset.url이 여기를 가리킨다.
    story-image-bucket: ${SUPABASE_STORY_IMAGE_BUCKET:qstory-story-images}
    profile-image-bucket: ${SUPABASE_PROFILE_IMAGE_BUCKET:qstory-profile-images}
  admin:
    story-import-token: ${QSTORY_STORY_IMPORT_TOKEN:}
  conversation-record:
    # 아이의 발화 원문·캐릭터 답을 남기는 conversation_record(db/schema/052)의 보존 일수.
    # ConversationRecordRetentionScheduler가 매일 이보다 오래된 행을 지운다. 0 이하 = 삭제 안 함.
    # 공개된 개인정보 안내 문구의 보관 기간과 어긋나지 않게 바꿀 것.
    retention-days: ${QSTORY_CONVERSATION_RECORD_RETENTION_DAYS:365}
  auth:
    jwt-secret: ${QSTORY_JWT_SECRET:}
    # "로그인 유지" 체크 시(와 회원가입) 토큰 수명 / 체크 해제 시 토큰 수명. 앱이 만료가 가까워지면 /v1/auth/refresh로 연장한다.
    remember-me-ttl-days: ${QSTORY_REMEMBER_ME_TTL_DAYS:90}
    session-ttl-hours: ${QSTORY_SESSION_TTL_HOURS:12}
  fcm:
    # 앱 푸시(FCM HTTP v1). Firebase 콘솔 > 프로젝트 설정 > 서비스 계정에서 받은 키 JSON 원문 또는 그 base64.
    # 비어 있으면 푸시는 보내지 않는다(부팅 때 fcm.disabled 한 줄). 인앱 알림은 영향 없다.
    service-account-json: ${QSTORY_FCM_SERVICE_ACCOUNT_JSON:}
    # 비우면 서비스 계정 JSON의 project_id를 쓴다.
    project-id: ${QSTORY_FCM_PROJECT_ID:}
  payments:
    toss:
      secret-key: ${TOSS_SECRET_KEY:}
      parent-monthly-amount: ${TOSS_PARENT_MONTHLY_AMOUNT:9900}
      # 기관 이용권은 학생 1명당 금액이다. 0이면(미설정) 기관 결제는 열리지 않는다.
      organization-student-monthly-amount: ${TOSS_ORGANIZATION_STUDENT_MONTHLY_AMOUNT:0}
      access-days: ${TOSS_ACCESS_DAYS:30}

logging:
  level:
    root: INFO
