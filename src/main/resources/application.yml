server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  application:
    name: q-story-speech-api
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 4MB
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SUPABASE_DB_USERNAME:postgres}
    password: ${SUPABASE_DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${SUPABASE_DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      # This is a fresh Supabase Postgres project - JPA entities are the single source of
      # truth for the schema. Hibernate creates/alters tables to match them on boot.
      ddl-auto: update
    properties:
      hibernate:
        default_schema: public
        jdbc.time_zone: UTC
        format_sql: false

qstory:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006,https://q-story-f07-pilot.kaangaa.chatgpt.site}
  max-audio-bytes: ${MAX_AUDIO_BYTES:2621440}
  request-timeout-ms: ${REQUEST_TIMEOUT_MS:40000}
  ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
  providers:
    rtzr:
      client-id: ${RTZR_CLIENT_ID:}
      client-secret: ${RTZR_CLIENT_SECRET:}
    open-router:
      api-key: ${OPENROUTER_API_KEY:}
      llm-model: ${OPENROUTER_LLM_MODEL:google/gemini-3.6-flash}
      tts-model: ${OPENROUTER_TTS_MODEL:google/gemini-3.1-flash-tts-preview}
      tts-voice: ${OPENROUTER_TTS_VOICE:Sulafat}
      image-model: ${OPENROUTER_IMAGE_MODEL:google/gemini-3.1-flash-image}
  supabase:
    url: ${SUPABASE_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    voice-research-bucket: ${SUPABASE_VOICE_RESEARCH_BUCKET:qstory-voice-research}
    shadow-assets-bucket: ${SUPABASE_SHADOW_ASSETS_BUCKET:qstory-shadow-assets}
    voice-research-cleanup-token: ${QSTORY_RESEARCH_CLEANUP_TOKEN:}

logging:
  level:
    root: INFO
